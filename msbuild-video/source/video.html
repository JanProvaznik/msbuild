<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>How MSBuild works</title>
<style>
  html, body { margin: 0; padding: 0; background: #070b18; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- palette ----------
const C = {
  bg: '#070b18', ink: '#eef1ff', soft: '#c9d0f0', dim: '#8b93b8', faint: '#3a4370', line: '#262f57',
  panel: 'rgba(18,25,54,0.88)', panel2: 'rgba(26,35,72,0.92)',
  purple: '#a78bfa', violet: '#7c3aed', teal: '#2dd4bf', amber: '#fbbf24', pink: '#f472b6',
  blue: '#60a5fa', green: '#4ade80', red: '#f87171', gray: '#6b7280'
};
const SANS = 'Inter', MONO = '"DejaVu Sans Mono"';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const env = (t, a, b, f = 0.4) => clamp((t - a) / f) * clamp((b - t) / f);
function rnd(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// ---------- drawing primitives ----------
function font(o) { return `${o.w || 400} ${o.s || 28}px ${o.mono ? MONO : SANS}`; }
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = font(o);
  ctx.fillStyle = o.c || C.ink;
  ctx.textAlign = o.al || 'left';
  ctx.textBaseline = o.bl || 'middle';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 18; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function tw(s, o = {}) { ctx.save(); ctx.font = font(o); ctx.letterSpacing = (o.ls || 0) + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// segments: [[text, color], ...]
function rich(segs, x, y, o = {}) {
  let cx = x;
  for (const [s, c, extra] of segs) { txt(s, cx, y, { ...o, ...(extra || {}), c }); cx += tw(s, { ...o, ...(extra || {}) }); }
  return cx;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function box(x, y, w, h, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  rr(x, y, w, h, o.r ?? 18);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.fillStyle = o.fill || C.panel; ctx.fill();
  ctx.shadowBlur = 0;
  if (o.stroke !== null) { ctx.lineWidth = o.lw || 1.5; ctx.strokeStyle = o.stroke || 'rgba(167,139,250,0.28)'; ctx.stroke(); }
  ctx.restore();
}
function pill(label, x, y, o = {}) {
  const s = o.s || 22, padX = o.px || 16, h = o.h || s + 20;
  const w = tw(label, { s, w: o.w || 500, mono: o.mono }) + padX * 2;
  const bx = o.al === 'center' ? x - w / 2 : x;
  box(bx, y - h / 2, w, h, { r: h / 2, fill: o.fill || hexA(o.c || C.purple, 0.16), stroke: o.stroke ?? hexA(o.c || C.purple, 0.6), a: o.a, glow: o.glow, gb: o.gb });
  txt(label, bx + padX, y + 1, { s, w: o.w || 500, c: o.tc || o.c || C.ink, mono: o.mono, a: o.a });
  return w;
}
function qpt(x1, y1, cx, cy, x2, y2, t) { const u = 1 - t; return [u * u * x1 + 2 * u * t * cx + t * t * x2, u * u * y1 + 2 * u * t * cy + t * t * y2]; }
function curve(x1, y1, cx, cy, x2, y2, p, o = {}) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.strokeStyle = o.c || C.faint; ctx.lineWidth = o.lw || 2.5; ctx.lineCap = 'round';
  if (o.dash) { ctx.setLineDash(o.dash); ctx.lineDashOffset = o.off || 0; }
  ctx.beginPath(); ctx.moveTo(x1, y1);
  const N = 40; let last = [x1, y1], prev = [x1, y1];
  for (let i = 1; i <= N; i++) { const tt = (i / N) * p; prev = last; last = qpt(x1, y1, cx, cy, x2, y2, tt); ctx.lineTo(last[0], last[1]); }
  ctx.stroke();
  if (o.head !== false && p > 0.05) {
    ctx.setLineDash([]);
    const a = Math.atan2(last[1] - prev[1], last[0] - prev[0]), L = o.hl || 14;
    ctx.fillStyle = o.c || C.faint; ctx.beginPath();
    ctx.moveTo(last[0], last[1]);
    ctx.lineTo(last[0] - L * Math.cos(a - 0.45), last[1] - L * Math.sin(a - 0.45));
    ctx.lineTo(last[0] - L * Math.cos(a + 0.45), last[1] - L * Math.sin(a + 0.45));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function line(x1, y1, x2, y2, p, o = {}) { curve(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2, x2, y2, p, o); }
function dot(x, y, r, c, o = {}) { ctx.save(); ctx.globalAlpha *= (o.a ?? 1); ctx.fillStyle = c; if (o.glow !== false) { ctx.shadowColor = c; ctx.shadowBlur = o.gb || 16; } ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function check(x, y, s, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = s * 0.18; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s * 0.35, y); ctx.lineTo(x - s * 0.08, y + s * 0.28); ctx.lineTo(x + s * 0.4, y - s * 0.3); ctx.stroke(); ctx.restore(); }
function withAlpha(a, fn) { ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function scaled(cx, cy, k, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function token(label, x, y, c, a = 1, s = 22) {
  pill(label, x, y, { al: 'center', c, s, w: 600, fill: hexA(c, 0.22), stroke: c, glow: c, gb: 18, a, tc: C.ink });
}
function codeColor(seg) { return seg; }
// Simple XML highlighter -> segments
function xmlSegs(line) {
  const segs = []; let i = 0;
  const re = /(<\/?)([\w.]+)|([\w.:]+)(=)("[^"]*")|(\/?>)|([^<"=\/>]+)|(.)/g;
  let m;
  while ((m = re.exec(line))) {
    if (m[2]) { segs.push([m[1], C.dim]); segs.push([m[2], C.blue]); }
    else if (m[3]) { segs.push([m[3], C.pink]); segs.push([m[4], C.dim]); segs.push([m[5], C.amber]); }
    else if (m[6]) segs.push([m[6], C.dim]);
    else if (m[7]) segs.push([m[7], C.ink]);
    else segs.push([m[8], C.ink]);
  }
  return segs;
}

// ---------- background ----------
const STARS = (() => { const r = rnd(7); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, z: 0.3 + r() * 0.7, ph: r() * 6.28 })); })();
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g1 = ctx.createRadialGradient(W * 0.25 + Math.sin(t * 0.1) * 80, H * 0.2, 0, W * 0.25, H * 0.2, 900);
  g1.addColorStop(0, 'rgba(124,58,237,0.20)'); g1.addColorStop(1, 'rgba(124,58,237,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createRadialGradient(W * 0.8, H * 0.85 + Math.cos(t * 0.08) * 60, 0, W * 0.8, H * 0.85, 1000);
  g2.addColorStop(0, 'rgba(45,212,191,0.10)'); g2.addColorStop(1, 'rgba(45,212,191,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  // dot grid
  ctx.fillStyle = 'rgba(120,135,200,0.07)';
  const off = (t * 6) % 48;
  for (let y = -48 + off; y < H; y += 48) for (let x = 0; x < W; x += 48) ctx.fillRect(x, y, 2, 2);
  for (const s of STARS) {
    const y = (s.y - t * 8 * s.z + H * 10) % H;
    dot(s.x, y, 1.2 * s.z, '#b9c3ff', { a: 0.25 + 0.25 * Math.sin(t * 1.3 + s.ph), glow: false });
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// ---------- chrome: chapter, file ref, caption ----------
function chapter(n, title, file, lt) {
  const a = prog(lt, 0.1, 0.7);
  const x = 120 - (1 - eout(a)) * 30;
  txt(n, x, 92, { s: 22, w: 700, c: C.teal, ls: 3, a });
  txt(title.toUpperCase(), x + 46, 92, { s: 22, w: 600, c: C.soft, ls: 5, a });
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = C.teal; ctx.fillRect(x, 116, 36 * eout(a), 3); ctx.restore();
  if (file) {
    const fa = prog(lt, 0.6, 1.3);
    const w = tw(file, { s: 19, mono: true });
    box(W - 120 - w - 52, 72, w + 52, 40, { r: 20, fill: 'rgba(20,28,58,0.7)', stroke: 'rgba(139,147,184,0.25)', a: fa });
    // tiny file glyph
    withAlpha(fa, () => { ctx.strokeStyle = C.dim; ctx.lineWidth = 1.5; rr(W - 120 - w - 36, 82, 14, 18, 3); ctx.stroke(); });
    txt(file, W - 120 - w - 14, 93, { s: 19, mono: true, c: C.dim, a: fa });
  }
}
function captions(list, lt) {
  for (const [a, b, s] of list) {
    const al = env(lt, a, b, 0.45);
    if (al <= 0) continue;
    const y = 1000 + (1 - eout(clamp((lt - a) / 0.45))) * 12;
    ctx.save(); ctx.globalAlpha *= al;
    const w = tw(s, { s: 31, w: 500 });
    const g = ctx.createLinearGradient(0, 940, 0, 1080);
    g.addColorStop(0, 'rgba(7,11,24,0)'); g.addColorStop(1, 'rgba(7,11,24,0.85)');
    ctx.fillStyle = g; ctx.fillRect(0, 930, W, 150);
    ctx.restore();
    txt(s, W / 2, y, { s: 31, w: 500, c: C.soft, al: 'center', a: al });
  }
}
function heading(s, lt, y = 170, sub) {
  const a = prog(lt, 0.2, 0.9);
  txt(s, 120, y - (1 - eout(a)) * 16, { s: 52, w: 700, c: C.ink, a });
  if (sub) txt(sub, 120, y + 48, { s: 26, c: C.dim, a: prog(lt, 0.5, 1.2) });
}

// =====================================================================
// SCENES
// =====================================================================
const PIPE = [['Parse', C.blue], ['Evaluate', C.purple], ['Schedule', C.teal], ['Targets', C.amber], ['Tasks', C.pink], ['Log', C.green]];

// ---- 0. Title ----
function sTitle(lt) {
  const title = 'How MSBuild works';
  const s = 128, o = { s, w: 800 };
  const total = tw(title, o);
  const x0 = W / 2 - total / 2;
  const grad = ctx.createLinearGradient(x0, 0, x0 + total, 0);
  grad.addColorStop(0, '#c4b5fd'); grad.addColorStop(0.5, '#a78bfa'); grad.addColorStop(1, '#5eead4');
  for (let i = 0; i < title.length; i++) {
    const p = eout(prog(lt, 0.3 + i * 0.045, 0.9 + i * 0.045));
    const px = x0 + tw(title.slice(0, i), o);
    ctx.save(); ctx.globalAlpha *= p;
    ctx.font = font(o); ctx.textBaseline = 'middle'; ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(167,139,250,0.55)'; ctx.shadowBlur = 40;
    ctx.fillText(title[i], px, 440 + (1 - p) * 40);
    ctx.restore();
  }
  txt('A tour of the build engine, read straight from its source code', W / 2, 560, { s: 36, c: C.dim, al: 'center', a: prog(lt, 1.5, 2.3) });
  const n = PIPE.length, gap = 230, sx = W / 2 - (gap * (n - 1)) / 2, y = 740;
  const lp = eio(prog(lt, 2.2, 3.8));
  ctx.save(); ctx.strokeStyle = 'rgba(139,147,184,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + gap * (n - 1) * lp, y); ctx.stroke(); ctx.restore();
  PIPE.forEach(([l, c], i) => {
    const p = eback(prog(lt, 2.3 + i * 0.25, 2.8 + i * 0.25));
    if (p <= 0) return;
    dot(sx + i * gap, y, 11 * p, c, { gb: 24 });
    txt(l, sx + i * gap, y + 46, { s: 24, w: 600, c: C.soft, al: 'center', a: clamp(p) });
  });
  // travelling spark
  const sp = prog(lt, 4.0, 6.2);
  if (sp > 0 && sp < 1) dot(sx + gap * (n - 1) * eio(sp), y, 6, '#fff', { gb: 30 });
}

// ---- 1. Command line ----
function sCLI(lt) {
  chapter('01', 'The command line', 'src/MSBuild/XMake.cs', lt);
  const tx = 120, ty = 220, twd = 880, th = 470;
  const a = prog(lt, 0.2, 0.8);
  box(tx, ty + (1 - eout(a)) * 30, twd, th, { r: 20, fill: 'rgba(10,14,32,0.95)', stroke: 'rgba(139,147,184,0.3)', a, glow: 'rgba(124,58,237,0.25)', gb: 60 });
  withAlpha(a, () => {
    [C.red, C.amber, C.green].forEach((c, i) => dot(tx + 32 + i * 26, ty + 30, 7, c, { glow: false }));
    txt('zsh — App', tx + twd / 2, ty + 30, { s: 19, c: C.dim, al: 'center' });
    ctx.fillStyle = 'rgba(139,147,184,0.15)'; ctx.fillRect(tx, ty + 58, twd, 1);
  });
  const cmd = 'dotnet build App.csproj -m -bl';
  const n = Math.floor(cmd.length * prog(lt, 0.9, 2.9));
  const ly = ty + 110;
  if (a > 0) {
    let x = rich([['~/src/App ', C.teal], ['$ ', C.dim]], tx + 36, ly, { s: 27, mono: true, a });
    x = rich([[cmd.slice(0, n), C.ink]], x, ly, { s: 27, mono: true, a });
    if (lt < 3.6 && Math.floor(lt * 2.2) % 2 === 0) { ctx.fillStyle = C.ink; ctx.fillRect(x + 2, ly - 16, 14, 32); }
  }
  const outs = [
    [3.3, [['# the dotnet CLI forwards to MSBuild', C.dim]]],
    [3.9, [['MSBuild.dll ', C.purple], ['-restore -maxcpucount -bl', C.amber]]],
    [4.3, [['            ', C.ink], ['-consoleloggerparameters:Summary', C.amber]]],
    [4.7, [['            ', C.ink], ['App.csproj', C.ink]]],
  ];
  outs.forEach(([t0, segs], i) => rich(segs, tx + 36, ly + 70 + i * 46, { s: 23, mono: true, a: prog(lt, t0, t0 + 0.4) }));

  // flow on the right
  const rx = 1150, rw = 650;
  const b1 = eback(prog(lt, 5.0, 5.6));
  if (b1 > 0) scaled(rx + rw / 2, 290, 0.9 + 0.1 * b1, () => {
    box(rx, 230, rw, 120, { a: clamp(b1), stroke: hexA(C.blue, 0.6), glow: hexA(C.blue, 0.25) });
    txt('XMake.Main(args)', rx + 32, 275, { s: 34, w: 700, mono: false, a: clamp(b1) });
    txt('entry point · parses switches & response files', rx + 32, 316, { s: 21, c: C.dim, a: clamp(b1) });
  });
  curve(tx + twd - 10, ly + 116, 1060, 260, rx - 8, 280, eio(prog(lt, 4.6, 5.3)), { c: hexA(C.blue, 0.7), lw: 3 });

  line(rx + rw / 2, 352, rx + rw / 2, 410, eio(prog(lt, 5.8, 6.2)), { c: C.faint });
  const pa = prog(lt, 6.1, 6.6);
  box(rx, 418, rw, 300, { a: pa });
  txt('Command-line switches → BuildParameters', rx + 32, 456, { s: 22, w: 600, c: C.soft, a: pa });
  const rows = [['-m', 'MaxNodeCount = cores'], ['-bl', 'BinaryLogger (.binlog)'], ['-restore', 'run Restore first'], ['-p:Configuration=Release', 'global property']];
  rows.forEach(([k, v], i) => {
    const p = eout(prog(lt, 6.6 + i * 0.4, 7.1 + i * 0.4));
    const y = 512 + i * 52;
    txt(k, rx + 32 + (1 - p) * 20, y, { s: 22, mono: true, c: C.amber, a: p });
    txt('→', rx + 360, y, { s: 22, c: C.dim, a: p });
    txt(v, rx + 400, y, { s: 21, c: C.ink, a: p });
  });
  line(rx + rw / 2, 720, rx + rw / 2, 776, eio(prog(lt, 8.4, 8.8)), { c: C.faint });
  const b3 = eback(prog(lt, 8.7, 9.3));
  if (b3 > 0) scaled(rx + rw / 2, 840, 0.9 + 0.1 * b3, () => {
    const pulse = 0.5 + 0.5 * Math.sin(lt * 3);
    box(rx, 784, rw, 116, { a: clamp(b3), fill: 'rgba(76,29,149,0.45)', stroke: C.purple, glow: hexA(C.violet, 0.4 + 0.3 * pulse), gb: 50 });
    txt('BuildManager', rx + 32, 826, { s: 36, w: 700, a: clamp(b3) });
    txt('BeginBuild → BuildSubmission → EndBuild', rx + 32, 868, { s: 21, c: C.soft, mono: true, a: clamp(b3) });
  });
  captions([
    [0.3, 5.8, 'It starts with a command: dotnet build forwards its arguments to MSBuild’s entry point, XMake.Main.'],
    [6.0, 11.7, 'Switches become BuildParameters (node count, loggers, global properties). Then the BuildManager takes over.'],
  ], lt);
}

// ---- 2. Project file & imports ----
const CSPROJ = [
  '<Project Sdk="Microsoft.NET.Sdk">',
  '  <PropertyGroup>',
  '    <TargetFramework>net10.0</TargetFramework>',
  '    <Nullable>enable</Nullable>',
  '  </PropertyGroup>',
  '  <ItemGroup>',
  '    <PackageReference Include="Humanizer" />',
  '    <ProjectReference Include="../Lib/Lib.csproj" />',
  '  </ItemGroup>',
  '</Project>',
];
function sProject(lt) {
  chapter('02', 'The project file', 'src/Build/Construction/ProjectRootElement.cs', lt);
  const px = 120, py = 170, pw = 880, ph = 530;
  const a = prog(lt, 0.2, 0.7);
  box(px, py, pw, ph, { a, fill: 'rgba(10,14,32,0.94)' });
  withAlpha(a, () => {
    box(px + 20, py + 16, 200, 40, { r: 10, fill: 'rgba(96,165,250,0.12)', stroke: hexA(C.blue, 0.5) });
    txt('App.csproj', px + 40, py + 37, { s: 20, mono: true, c: C.blue });
  });
  CSPROJ.forEach((l, i) => {
    const p = eout(prog(lt, 0.5 + i * 0.2, 0.9 + i * 0.2));
    txt(String(i + 1).padStart(2, ' '), px + 26, py + 100 + i * 43, { s: 20, mono: true, c: C.faint, a: p });
    rich(xmlSegs(l), px + 74 + (1 - p) * 16, py + 100 + i * 43, { s: 23, mono: true, a: p });
  });
  // Sdk highlight
  const hp = prog(lt, 3.4, 3.9);
  if (hp > 0) {
    const sx = px + 74 + tw('<Project ', { s: 23, mono: true });
    const sw = tw('Sdk="Microsoft.NET.Sdk"', { s: 23, mono: true });
    const pulse = 0.5 + 0.5 * Math.sin(lt * 4);
    box(sx - 8, py + 80, sw + 16, 40, { r: 8, fill: 'rgba(244,114,182,0.10)', stroke: C.pink, lw: 2, a: hp, glow: hexA(C.pink, 0.3 + 0.3 * pulse) });
  }
  // SDK resolver pill + tree
  const rx = 1100;
  curve(px + 520, py + 80, 950, 150, rx - 10, 220, eio(prog(lt, 3.9, 4.6)), { c: hexA(C.pink, 0.8), lw: 3 });
  const rp = eback(prog(lt, 4.4, 4.9));
  if (rp > 0) pill('SdkResolverService  →  Microsoft.NET.Sdk/Sdk', rx, 220, { c: C.pink, s: 22, a: clamp(rp), mono: false });

  const tree = [
    [0, 'App.csproj', C.ink, '', 700],
    [1, 'Sdk.props', C.pink, 'implicit import'],
    [2, 'Microsoft.Common.props', C.blue, '145 lines'],
    [3, 'Directory.Build.props', C.amber, 'yours, if present'],
    [1, 'your PropertyGroups & ItemGroups', C.teal, '10 lines'],
    [1, 'Sdk.targets', C.pink, 'implicit import'],
    [2, 'Microsoft.CSharp.targets', C.blue, ''],
    [3, 'Microsoft.Common.CurrentVersion.targets', C.blue, '7,144 lines'],
  ];
  const ty0 = 300, rh = 66, ind = 44;
  const parentOf = i => { for (let j = i - 1; j >= 0; j--) if (tree[j][0] < tree[i][0]) return j; return -1; };
  tree.forEach(([lvl, name, c, note, w], i) => {
    const p = eout(prog(lt, 5.0 + i * 0.42, 5.5 + i * 0.42));
    if (p <= 0) return;
    const x = rx + lvl * ind, y = ty0 + i * rh;
    const par = parentOf(i);
    if (par >= 0) {
      const pxx = rx + tree[par][0] * ind + 10, pyy = ty0 + par * rh + 18;
      ctx.save(); ctx.globalAlpha *= p; ctx.strokeStyle = 'rgba(139,147,184,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pxx, pyy); ctx.lineTo(pxx, y); ctx.lineTo(x - 6, y); ctx.stroke(); ctx.restore();
    }

const TROWS = [

  [1, 'AfterBuild'], [0, 'ZipOutput', 'AfterTargets="Build"'],

const TEV = (() => {
  const ev = []; let t = 2.4;
  const push = (ids, parent, why) => { ev.push({ t, type: 'push', ids, parent, why }); t += 0.75; };
  const run = (id, d = 0.6) => { ev.push({ t, type: 'run', id, d }); t += d + 0.3; };
  const cached = id => { ev.push({ t, type: 'cached', id, d: 0.8 }); t += 1.1; };
  push([0], null);
  push([10, 2, 1], 0, 'DependsOnTargets');
  run(1);
  push([9, 5, 4, 3], 2, 'DependsOnTargets');
  run(3); run(4);
  push([8, 6], 5, 'DependsOnTargets');
  cached(6);
  push([7], 8, 'BeforeTargets');
  run(7); run(8, 1.0); run(5, 0.4); run(9); run(2, 0.4); run(10, 0.4); run(0, 0.4);
  push([11], null, 'AfterTargets');
  run(11);

  return ev;
})();

      if (e.parent !== null) status[e.parent] = 'deps';
      if (e.why) note = [e.why, e.t, e.parent];

      const p = prog(lt, t0, t0 + 0.9);
      if (p <= 0 || p >= 1) return;
      const name = EVN[(k * 5 + (k % 3)) % EVN.length];
      dot(lerp(HX + HW, x, eio(p)), lerp(HY + HH / 2, y + h / 2, eio(p)), 4.5, EVC[name], { a: Math.sin(p * Math.PI) });
    });
  }
  captions([
    [0.3, 4.8, 'Nodes don’t print. They raise events: project, target and task started and finished, messages, warnings.'],
    [4.9, 10.6, 'The LoggingService collects them on the main node and fans them out to every registered logger.'],
    [10.7, 16.6, 'Terminal Logger draws live progress, -bl records everything to a .binlog, BuildCheck spots problems.'],
  ], lt);
}

// ---- 9. Outro ----
function sOutro(lt) {
  const n = PIPE.length, gap = 280, sx = W / 2 - (gap * (n - 1)) / 2, y = 380;
  const subs = ['XMake · ProjectRootElement', 'Evaluator · 6 passes', 'BuildManager · Scheduler', 'TargetBuilder', 'TaskExecutionHost', 'LoggingService'];
  const lp = eio(prog(lt, 0.3, 1.8));
  ctx.save(); ctx.strokeStyle = 'rgba(139,147,184,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + gap * (n - 1) * lp, y); ctx.stroke(); ctx.restore();
  PIPE.forEach(([l, c], i) => {
    const p = eback(prog(lt, 0.3 + i * 0.25, 0.8 + i * 0.25));
    if (p <= 0) return;
    const glow = Math.max(0, 1 - Math.abs((lt - 2.2) * 1.6 - i) * 0.8);
    dot(sx + i * gap, y, (14 + 8 * glow) * p, c, { gb: 24 + 30 * glow });
    txt(l, sx + i * gap, y + 58, { s: 30, w: 700, c: C.ink, al: 'center', a: clamp(p) });
    txt(subs[i], sx + i * gap, y + 98, { s: 18, c: C.dim, al: 'center', a: clamp(p) });
  });
  const sp = prog(lt, 2.0, 4.0);
  if (sp > 0 && sp < 1) dot(sx + gap * (n - 1) * eio(sp), y, 7, '#fff', { gb: 30 });
  const ba = prog(lt, 4.2, 4.8);
  box(W / 2 - 420, 600, 840, 190, { a: ba, fill: 'rgba(10,14,32,0.94)', stroke: 'rgba(74,222,128,0.4)' });
  txt('Build succeeded.', W / 2 - 380, 650, { s: 32, mono: true, w: 700, c: C.green, a: ba, glow: hexA(C.green, 0.5) });
  txt('    0 Warning(s)', W / 2 - 380, 698, { s: 24, mono: true, c: C.soft, a: prog(lt, 4.8, 5.1) });
  txt('    0 Error(s)', W / 2 - 380, 738, { s: 24, mono: true, c: C.soft, a: prog(lt, 5.1, 5.4) });
  txt('Read the source: github.com/JanProvaznik/msbuild', W / 2, 900, { s: 28, w: 500, c: C.dim, al: 'center', a: prog(lt, 5.8, 6.6) });
}

// =====================================================================
const SCENES = [
  [sTitle, 7], [sCLI, 12], [sProject, 16], [sEval, 27], [sSched, 26], [sTargets, 24], [sIncr, 14], [sTasks, 17], [sLog, 17], [sOutro, 10]
];
let acc = 0; for (const s of SCENES) { s.push(acc); acc += s[1]; }
const DURATION = acc;
window.DURATION = DURATION; window.FPS = FPS;

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  background(t);
  for (const [fn, d, s] of SCENES) {
    if (t < s || t >= s + d) continue;
    const lt = t - s;
    const last = fn === sOutro;
    const al = clamp(lt / 0.6) * (last ? clamp((d - lt) / 1.2) : clamp((d - lt) / 0.6));
    ctx.save(); ctx.globalAlpha = al; fn(lt); ctx.restore();
  }
  // top progress line
  ctx.fillStyle = 'rgba(167,139,250,0.55)'; ctx.fillRect(0, 0, W * (t / DURATION), 3);
}
window.renderFrame = renderFrame;
window.ready = document.fonts.load('700 20px Inter').then(() => document.fonts.load('20px "DejaVu Sans Mono"')).then(() => { renderFrame(0); return true; });
// preview mode
if (location.hash.startsWith('#t=')) { window.ready.then(() => renderFrame(parseFloat(location.hash.slice(3)))); }
else if (location.hash === '#play') { const st = performance.now(); const loop = () => { renderFrame(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>
