// ---------- code highlighting (Starlark / Rust / ini) ----------
const KW = new Set(['load', 'def', 'return', 'if', 'for', 'in', 'pub', 'trait', 'type', 'async', 'fn', 'self', 'mut', 'impl', 'let', 'await', 'select']);
function codeSegs(line) {
  if (/^\s*\[[\w.]+\]\s*$/.test(line)) return [[line, C.pink]];
  const ini = line.match(/^(\s*)([\w.]+)(\s*=\s*)([^"(\[{]*)$/);
  if (ini && !/[(){}]/.test(line)) return [[ini[1], C.ink], [ini[2], C.mint], [ini[3], C.dim], [ini[4], C.yellow]];
  const segs = [];
  const re = /(#.*$|\/\/ .*$|\/\/\/.*$)|("[^"]*")|([A-Za-z_][\w]*)(?=\s*\()|([A-Za-z_][\w]*)(?=\s*=[^=])|([A-Za-z_][\w.]*)|(\s+)|(.)/g;
  let m;
  while ((m = re.exec(line))) {
    if (m[1]) segs.push([m[1], C.dim]);
    else if (m[2]) segs.push([m[2], C.yellow]);
    else if (m[3]) segs.push([m[3], KW.has(m[3]) ? C.pink : C.sky]);
    else if (m[4]) segs.push([m[4], C.orange]);
    else if (m[5]) segs.push([m[5], KW.has(m[5]) ? C.pink : (/^[A-Z]/.test(m[5]) ? C.mint : C.ink)]);
    else segs.push([m[6] || m[7], C.soft]);
  }
  return segs;
}

  chapter('08', 'Deferred materialization', 'buck2_execute_impl/src/materializers/deferred.rs', lt);

  if (ca > 0) scaled(1450, 340, 0.7 + 0.3 * ca, () => {
    cloud(1100, 170, 700, 330, { a: clamp(ca) });
    txt('Remote CAS', 1450, 260, { s: 28, w: 800, al: 'center', a: clamp(ca) });
    txt('content digest → bytes', 1450, 296, { s: 18, mono: true, c: C.dim, al: 'center', a: clamp(ca) });
  });
  MATF.forEach(([n, , cx], i) => {
    const p = spring(prog(lt, 1.4 + i * 0.3, 2.2 + i * 0.3));
    if (p > 0) scaled(cx, 400, p, () => { fileIcon(cx, 390 + Math.sin(lt * 2 + i) * 5, 60, C.sky); txt(n, cx, 450, { s: 19, mono: true, w: 700, al: 'center' }); });
  });
  // local disk
  const da = prog(lt, 2.8, 3.4);
  box(120, 560, 1000, 360, { a: da, fill: 'rgba(28,18,58,0.9)' });
  txt('buck-out/v2/gen/', 150, 600, { s: 22, w: 700, mono: true, c: C.ink, a: da });
  txt('your disk', 1090, 600, { s: 18, c: C.dim, al: 'right', a: da });
  const DIG = ['6e34…', 'b1c0…', 'f00d…'];
  MATF.forEach(([n, gx, cx], i) => {
    const p = prog(lt, 3.4 + i * 0.3, 3.9 + i * 0.3);
    const lp = prog(lt, 4.4 + i * 0.4, 5.4 + i * 0.4);
    curve(cx, 470, (cx + gx) / 2, 520, gx, 650, eio(lp), { c: hexA(C.lilac, 0.6), lw: 2.5, dash: [3, 9], off: -lt * 20, head: false });
    const solid = i === 2 ? eout(prog(lt, 18.2, 19.0)) : 0;
    ghost(gx, 730, 120, lt, { a: p, solid, seed: i * 2 });
    txt(n, gx, 830, { s: 21, mono: true, w: 700, al: 'center', c: solid > 0.5 ? C.green : C.soft, a: p });
    txt('sha256:' + DIG[i], gx, 862, { s: 16, mono: true, al: 'center', c: C.dim, a: prog(lt, 5.0 + i * 0.4, 5.6 + i * 0.4) });
  });
  const bk = spring(prog(lt, 5.6, 6.6));
  if (bk > 0) scaled(260, 340, bk, () => bucky(260, 340, 60, lt, { mood: lt > 6.6 && lt < 10 ? 'o' : 'smile', look: [0.6, 1], hop: lt > 18.8 && lt < 21 ? 5 : 0 }));
  say(300, 270, 'Boo! Ghost files!', lt, 6.6, 10.0, { dx: 230, dy: -60, s: 24 });
  say(300, 270, 'Only what you need!', lt, 19.2, 23.0, { dx: 230, dy: -60, s: 24 });
  badge('declare_cas_many(): just the digests', 760, 420, C.lilac, env(lt, 4.6, 10.4, 0.3), 17);
  // the materializer, with a checklist
  const mp = spring(prog(lt, 8.6, 9.6));
  if (mp > 0) scaled(1290, 700, mp, () => critter(1290, 700, 62, C.lilac, lt, { glasses: true, look: lt > 15.4 && lt < 19 ? [-1, 0.2] : [0.8, 0.2], mood: lt > 19 ? 'grin' : 'smile', seed: 50 }));
  txt('Deferred', 1290, 800, { s: 22, w: 800, al: 'center', c: C.lilac, a: prog(lt, 9.0, 9.6) });
  txt('Materializer', 1290, 828, { s: 22, w: 800, al: 'center', c: C.lilac, a: prog(lt, 9.0, 9.6) });
  const la = prog(lt, 9.6, 10.2);
  box(1400, 600, 400, 210, { a: la, fill: '#fff8ee', stroke: null, r: 16 });
  MATF.forEach(([n], i) => {
    const on = i === 2 && lt > 18.6;
    const p = prog(lt, 10.0 + i * 0.3, 10.4 + i * 0.3);
    txt(n, 1430, 650 + i * 56, { s: 20, mono: true, w: 700, c: C.dark, a: p });
    txt(on ? 'on disk' : 'in CAS only', 1600, 650 + i * 56, { s: 19, c: on ? '#178a3e' : '#7d63b8', a: p, w: 600 });
    if (on) check(1770, 650 + i * 56, 22, '#178a3e', 1); else dot(1770, 650 + i * 56, 6, '#b9a6ea', { a: p, glow: false });
  });
  // a request comes in: download just main
  badge('you asked for main → ensure_materialized()', 760, 420, C.green, env(lt, 15.0, 23.6, 0.3), 17);
  for (let k = 0; k < 10; k++) {
    const q = prog(lt, 16.2 + k * 0.18, 17.4 + k * 0.18);
    if (q > 0 && q < 1) { const [x, y] = qpt(1640, 470, 1300, 560, 820, 700, eio(q)); ctx.save(); ctx.translate(x, y); ctx.rotate(q * 6); ctx.fillStyle = CONF[k % 6]; ctx.fillRect(-7, -7, 14, 14); ctx.restore(); }
  }
  confetti(820, 700, lt, 18.8, { n: 50, seed: 12, speed: 480 });
  badge('print.o & main.o: never downloaded', 430, 900, C.mint, prog(lt, 20.0, 20.6), 17);
  captions([
    [0.3, 8.0, 'When an action runs remotely, its outputs stay in the remote CAS. Buck2 keeps just their digests.'],
    [8.2, 15.4, 'Locally they’re ghosts: declared in buck-out but not downloaded, tracked by the materializer.'],
    [15.6, 23.6, 'Only files someone actually needs get downloaded. The rest never leave the cloud.'],
  ], lt);
}

// ---- 9. Incremental ----
const CHAIN = [['ReadFileKey', 'lib/print.cpp', C.sky, 300], ['BuildKey', 'cxx_compile print.o', C.pink, 740], ['BuildKey', 'cxx_link main', C.orange, 1180]];
const SLEEPY = [['ReadFileKey', 'app/main.cpp', C.sky, 300], ['BuildKey', 'cxx_compile main.o', C.pink, 740], ['AnalysisKey', 'root//app:main', C.orange, 1180]];
function sIncr(lt) {
  chapter('09', 'Incremental builds', 'buck2_common/src/file_ops/dice.rs', lt);
  // edit card
  const ea = prog(lt, 0.4, 1.0);
  box(120, 180, 700, 150, { a: ea, fill: 'rgba(24,14,50,0.95)', stroke: 'rgba(196,181,253,0.35)' });
  txt('lib/print.cpp', 150, 214, { s: 18, mono: true, c: C.dim, a: ea });
  const typed = '// TODO: say hi louder';
  const n = Math.floor(typed.length * prog(lt, 1.0, 2.8));
  txt('+ ' + typed.slice(0, n), 150, 262, { s: 26, mono: true, c: C.green, a: ea });
  txt('a comment at the end of the file', 150, 304, { s: 18, c: C.dim, a: prog(lt, 2.8, 3.3) });
  // watchman
  const wp = spring(prog(lt, 0.8, 1.6));
  const spot = env(lt, 3.2, 6.0, 0.2);
  if (wp > 0) scaled(980, 260, wp, () => critter(980, 260 - spot * 14, 58, C.yellow, lt, { binoculars: true, mood: spot > 0 ? 'o' : 'smile', seed: 60, tilt: -0.1 }));
  if (spot > 0) txt('!', 1040, 170 - spring(prog(lt, 3.2, 3.8)) * 20, { s: 64, w: 900, disp: true, c: C.coral, a: spot, glow: hexA(C.coral, 0.6) });
  txt('file watcher', 980, 350, { s: 20, w: 700, al: 'center', c: C.yellow, a: prog(lt, 1.2, 1.8) });
  const ca = prog(lt, 4.0, 4.6);
  box(1100, 196, 700, 120, { a: ca, fill: 'rgba(24,14,50,0.95)', stroke: hexA(C.sky, 0.5) });
  txt('FileChangeTracker::write_to_dice', 1130, 232, { s: 18, mono: true, c: C.dim, a: ca });
  rich([['ctx', C.ink], ['.', C.soft], ['changed', C.sky], ['(self.files_to_dirty)?;', C.soft]], 1130, 278, { s: 24, mono: true, a: ca });
  curve(940, 320, 760, 420, 330, 508, eio(prog(lt, 4.8, 5.6)), { c: hexA(C.yellow, 0.8), lw: 3, dash: [10, 8], off: -lt * 30 });
  // sleepy row
  SLEEPY.forEach(([type, key, c, x], i) => {
    const a = prog(lt, 0.8 + i * 0.2, 1.3 + i * 0.2);
    const dim = 0.35 + 0.65 * (1 - prog(lt, 7.0, 8.0));
    withAlpha(dim, () => dnode(x, 790, type, key, c, lt, { a, done: 1, state: lt > 7.5 ? 'sleep' : 'happy', seed: i + 9 }));
    if (i < 2) line(x + 196, 790, x + 244, 790, a, { c: hexA(C.soft, 0.25) });
    if (lt > 8) zzz(x + 150, 740, lt + i, prog(lt, 8.0, 8.6) * 0.8);
  });
  line(940, 760, 1060, 600, prog(lt, 1, 1.5), { c: hexA(C.soft, 0.2) });
  badge('untouched: still asleep', 740, 690, C.dim, prog(lt, 8.4, 9.0), 17);
  // dirty chain
  const dirtyT = [5.6, 6.6, 7.6], doneT = [10.6, 15.0, 18.4];
  CHAIN.forEach(([type, key, c, x], i) => {
    const a = prog(lt, 0.6 + i * 0.2, 1.1 + i * 0.2);
    const dirty = prog(lt, dirtyT[i], dirtyT[i] + 0.3);
    const done = Math.max(1 - dirty, prog(lt, doneT[i], doneT[i] + 0.4));
    const working = (i === 0 && lt > 9.4 && lt < 10.6) || (i === 1 && lt > 11.2 && lt < 15.0);
    const state = done >= 1 ? 'happy' : (working ? 'roll' : 'o');
    const col = dirty > 0 && done < 1 ? (i === 0 ? C.red : C.yellow) : c;
    dnode(x, 560, type, key, col, lt, { a, done, pend: dirty > 0 && done < 1 ? 1 : 0, state, seed: i * 7, hot: working ? 0.6 + 0.4 * Math.sin(lt * 8) : 0 });
    if (i < 2) line(x + 196, 560, x + 244, 560, a, { c: hexA(C.soft, 0.45) });
  });
  line(1376, 560, 1450, 560, prog(lt, 1, 1.4), { c: hexA(C.soft, 0.45) });
  const outDone = lt > 18.4 || lt < 7.6;
  pill('main', 1460, 560, { s: 24, mono: true, c: outDone ? C.green : C.yellow, a: prog(lt, 1, 1.4) });
  badge('dirty!', 300, 480, C.red, env(lt, 5.8, 10.6, 0.3), 17);
  badge('maybe dirty: needs a check', 960, 470, C.yellow, env(lt, 7.0, 11.0, 0.3), 17);
  badge('new contents', 300, 480, C.sky, env(lt, 10.8, 14.6, 0.3), 17);
  badge('recompiling…', 740, 480, C.pink, env(lt, 11.4, 15.0, 0.3), 17);
  badge('print.o: same bytes as before!', 740, 480, C.green, env(lt, 15.2, 21.0, 0.3), 17);
  badge('inputs equal → keep old value', 1180, 480, C.green, prog(lt, 17.6, 18.2), 17);
  badge('no relink', 1460, 480, C.green, prog(lt, 18.8, 19.3), 17);
  confetti(1180, 560, lt, 18.6, { n: 60, seed: 14 });
  const bp = spring(prog(lt, 19.6, 20.6));
  if (bp > 0) scaled(1700, 820, bp, () => bucky(1700, 820, 58, lt, { mood: 'grin', look: [-1, -0.6], hop: 4 }));
  say(1700, 740, 'Zero relinks!', lt, 20.4, 24.6, { dx: -40, dy: -70, s: 24 });
  captions([
    [0.3, 9.0, 'Edit a file, and the file watcher (Watchman or notify) tells the daemon exactly what changed.'],
    [9.2, 17.6, 'DICE marks that key changed in a new version, and re-checks only the keys that depend on it.'],
    [17.8, 29.4, 'If a recomputed value equals the old one, DICE stops right there. No relink needed!'],
  ], lt);
}

// ---- 10. Outro ----
function sOutro(lt) {
  const n = PIPE.length, gap = 250, sx = W / 2 - (gap * (n - 1)) / 2, y = 380;
  const subs = ['buck2 client', 'buck2 daemon', 'starlark-rust', 'dice', 'AnalysisKey', 'HybridExecutor', 'deferred'];
  const lp = eio(prog(lt, 0.3, 1.8));
  ctx.save(); ctx.strokeStyle = 'rgba(196,181,253,0.35)'; ctx.lineWidth = 3; ctx.setLineDash([2, 12]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + gap * (n - 1) * lp, y); ctx.stroke(); ctx.restore();
  PIPE.forEach(([l, c], i) => {
    const p = spring(prog(lt, 0.3 + i * 0.25, 1.1 + i * 0.25));
    if (p <= 0) return;
    const glow = Math.max(0, 1 - Math.abs((lt - 2.2) * 2.2 - i) * 0.8);
    die(sx + i * gap, y - glow * 16, (44 + 10 * glow) * p, c, lt, { state: glow > 0.3 ? 'happy' : 'pips', n: (i % 6) + 1, seed: i });
    txt(l, sx + i * gap, y + 60, { s: 28, w: 800, c: C.ink, al: 'center', a: clamp(p) });
    txt(subs[i], sx + i * gap, y + 98, { s: 17, mono: true, c: C.dim, al: 'center', a: clamp(p) });
  });
  txt('all of it memoized in one DICE graph', W / 2, 250, { s: 28, w: 600, c: C.yellow, al: 'center', a: prog(lt, 1.6, 2.2) });
  const ba = prog(lt, 4.2, 4.8);
  box(W / 2 - 560, 600, 820, 180, { a: ba, fill: 'rgba(20,12,42,0.96)', stroke: hexA(C.green, 0.45) });
  txt('BUILD SUCCEEDED', W / 2 - 520, 656, { s: 34, mono: true, w: 700, c: C.green, a: ba, glow: hexA(C.green, 0.6) });
  txt('Jobs completed: 41. Time elapsed: 0.6s.', W / 2 - 520, 716, { s: 22, mono: true, c: C.soft, a: prog(lt, 4.8, 5.2) });
  const bp = spring(prog(lt, 4.6, 5.6));
  if (bp > 0) scaled(W / 2 + 430, 730, bp, () => bucky(W / 2 + 430, 730, 74, lt, { mood: 'grin', hop: 3, look: [-0.5, 0] }));
  say(W / 2 + 430, 600, 'Thanks for visiting!', lt, 5.8, 12.4, { dx: 60, dy: -50, s: 24 });
  confetti(W / 2, 600, lt, 5.0, { n: 90, seed: 21, speed: 800, spread: 3.0 });
  txt('Read the source: github.com/facebook/buck2', W / 2, 900, { s: 30, w: 600, c: C.dim, al: 'center', a: prog(lt, 6.4, 7.2) });
}

// =====================================================================
const SCENES = [
  [sTitle, 11], [sClient, 30], [sCells, 28], [sPrelude, 26], [sDice, 40], [sConfig, 24], [sAnalysis, 26], [sExec, 32], [sMat, 24], [sIncr, 30], [sOutro, 13]
];
let acc = 0; for (const s of SCENES) { s.push(acc); acc += s[1]; }
const DURATION = acc;
window.DURATION = DURATION; window.FPS = FPS;

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  background(t);
  for (const [fn, d, s] of SCENES) {
    if (t < s || t >= s + d) continue;
    const lt = t - s;
    const last = fn === SCENES[SCENES.length - 1][0];
    const al = clamp(lt / 0.6) * (last ? clamp((d - lt) / 1.2) : clamp((d - lt) / 0.6));
    ctx.save(); ctx.globalAlpha = al; fn(lt); ctx.restore();
  }
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, C.yellow); g.addColorStop(0.5, C.orange); g.addColorStop(1, C.pink);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * (t / DURATION), 4);
}
window.renderFrame = renderFrame;
window.ready = document.fonts.load('800 20px Inter').then(() => document.fonts.load('900 20px "Inter Display"')).then(() => document.fonts.load('20px "DejaVu Sans Mono"')).then(() => { renderFrame(0); return true; });
if (location.hash.startsWith('#t=')) { window.ready.then(() => renderFrame(parseFloat(location.hash.slice(3)))); }
else if (location.hash === '#play') { const st = performance.now(); const loop = () => { renderFrame(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>
